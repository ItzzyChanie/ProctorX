<!doctype html>
<html>
  <head>
    <style>
      body {
        font-family: Arial;
        margin: 40px;
      }
      h1 {
        color: #2922aa;
      }
      table {
        border-collapse: collapse;
        width: 100%;
      }
      th,
      td {
        border: 1px solid #ddd;
        padding: 8px;
      }
      .heatmap {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }
      .heatmap li {
        background: #f4f1ff;
        padding: 12px;
        list-style: none;
      }
    </style>
  </head>
  <body>
    <h1>ProctorX Incident Report</h1>
    <p>
      <b>Student:</b> Student<br /><b>Exam:</b> Exam<br /><b>Session:</b> smoke
    </p>
    <h2>Final suspicion score: 42 (Medium)</h2>
    <h2>Violations summary / heatmap</h2>
    <ul class="heatmap">
      <li>TAB SWITCH: 1</li>
    </ul>
    <h2>Activity timeline</h2>
    <table>
      <thead>
        <tr>
          <th>Time</th>
          <th>Event</th>
          <th>Intensity</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>2026-08-20T10:00:00Z</td>
          <td>TAB SWITCH</td>
          <td>0.50</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
