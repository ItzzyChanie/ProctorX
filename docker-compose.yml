services:
  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: proctorx
      POSTGRES_PASSWORD: proctorx_dev
      POSTGRES_DB: proctorx
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"

volumes:
  pgdata:
